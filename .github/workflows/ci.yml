name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: noexit
          MARIADB_USER: noexit
          MARIADB_PASSWORD: noexit
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379

    # Dummy values for CI only. No real secrets are used.
    env:
      DB_HOST: localhost
      DB_PORT: "3306"
      DB_USERNAME: noexit
      DB_PASSWORD: noexit
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      MAIL_HOST: localhost
      MAIL_PORT: "1025"
      MAIL_USERNAME: ci
      MAIL_PASSWORD: ci
      JWT_SECRET: Y2ktb25seS1qd3Qtc2VjcmV0LWZvci10ZXN0cy0wMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      JWT_SECRET_RT: Y2ktb25seS1yZWZyZXNoLXNlY3JldC1mb3ItdGVzdHMtMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      AWS_ACCESS_KEY: ci-dummy
      AWS_SECRET_KEY: ci-dummy
      AWS_REGION: ap-northeast-2
      AWS_BUCKET_NAME: noexit-ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
