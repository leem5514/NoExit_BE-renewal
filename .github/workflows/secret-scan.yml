name: Secret Scan

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '7 0 * * 1'   # 매주 월 09:07 KST (UTC 00:07)
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open issue when the scheduled/manual scan finds secrets
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "주간 시크릿 스캔: 시크릿 후보 발견 ($(date -u +%F))" \
            --body "gitleaks가 저장소 히스토리에서 시크릿 후보를 찾았습니다. 값은 로그에서 가려져 있습니다. 실행 로그: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — 실제 시크릿이면 먼저 키를 교체하고, 그다음 히스토리를 정리하세요."